# Konto usług dla każdego własnego workloadu (T11): nazwa i namespace jak workloadu, bez tokenu API
# i bez Role ani bindingów, bo żaden pod nie rozmawia z API Kubernetesa.
# Deployment podaje serviceAccountName i dodatkowo automountServiceAccountToken: false w specyfikacji poda.
# anomaly-detector (T24) ma konto przed swoim Deploymentem.
# Lista kont jest też w tests/security/test_rbac.py (SERVICE_ACCOUNTS) i docs/architektura.md („RBAC”): zmieniaj razem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: shop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: secure-k8s-aiops
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders
  namespace: shop
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: secure-k8s-aiops
automountServiceAccountToken: false
---
