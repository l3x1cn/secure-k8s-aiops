apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: loadgen
resources:
  - deployment.yaml
# Sufiks z hasza treści zmienia nazwę ConfigMap, więc zmiana locustfile.py restartuje poda przy make deploy.
configMapGenerator:
  - name: locustfile
    files:
      - locustfile.py
    options:
      labels:
        app.kubernetes.io/name: locust
        app.kubernetes.io/part-of: secure-k8s-aiops
