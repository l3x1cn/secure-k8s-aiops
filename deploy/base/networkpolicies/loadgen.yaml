# Przepływy z loadgen (T12): fault-runner i locust wołają tylko usługi w shop na porcie 8080.
# Do podów loadgen nikt się nie łączy (fault-runner czeka na `kubectl exec`), więc ingress odcina default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fault-runner-egress
  namespace: loadgen
  labels:
    app.kubernetes.io/part-of: secure-k8s-aiops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fault-runner
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchLabels:
              app.kubernetes.io/name: orders
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8080
---
# Locust (T18): Deployment nadaje podowi app.kubernetes.io/name=locust.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: locust-egress
  namespace: loadgen
  labels:
    app.kubernetes.io/part-of: secure-k8s-aiops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: locust
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shop
          podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - protocol: TCP
          port: 8080
