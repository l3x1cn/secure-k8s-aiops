# Namespace'y z docs/architektura.md („Namespace'y i Pod Security”), T04; kube-system zostaje bez zmian.
# Etykieta enforce według tabeli; warn, audit i test Pod Security dodaje T13.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: intruder
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # Wyjątek z tabeli: node-exporter (T16) i Alloy (T17) potrzebują dostępu do hosta.
    pod-security.kubernetes.io/enforce: privileged
