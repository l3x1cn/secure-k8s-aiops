apiVersion: apps/v1
kind: Deployment
metadata:
  name: fault-runner
  labels:
    app.kubernetes.io/name: fault-runner
    app.kubernetes.io/part-of: secure-k8s-aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fault-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-runner
        app.kubernetes.io/part-of: secure-k8s-aiops
        # Selektor NetworkPolicy (T12): tylko ten pod może wołać /faults/* w orders.
        role: fault-runner
    spec:
      # Kontener tylko czeka na `kubectl exec`; nie potrzebuje API Kubernetesa.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Plik tokenu należy do grupy 10001, więc tryb 0440 wystarcza do odczytu.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fault-runner
          # Tag ustawia overlay (local: :dev z `make images`).
          image: ghcr.io/l3x1cn/secure-k8s-aiops/fault-runner
          env:
            - name: ORDERS_URL
              value: http://orders.shop.svc:8080
            - name: FRONTEND_URL
              value: http://frontend.shop.svc:8080
            - name: FAULT_TOKEN_FILE
              value: /var/run/secrets/fault-token/token
          resources:
            # Skok ruchu (S6) to 50 współbieżnych użytkowników w jednym procesie asyncio.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: fault-token
              mountPath: /var/run/secrets/fault-token
              readOnly: true
      volumes:
        - name: fault-token
          secret:
            secretName: fault-token
            defaultMode: 0440
            items:
              - key: token
                path: token
