version = 1

# Cele HTTP dla /qa:run (T03). Jedyny udokumentowany origin HTTP dostępny z hosta to Hubble UI;
# jako jedyny cel obsługuje scenariusze FE i BE. Frontend (http://localhost:8080, NodePort 30080),
# Grafana (:3000) i Mailpit UI (:8025) z docs/architektura.md:46-48 nie mają jeszcze wdrożenia
# (services/ i deploy/ zawierają tylko pliki .gitkeep; T05, T16, T19), więc ich tu nie ma.
[env.targets]
# Makefile:38-40 (`make hubble-ui`: `cilium hubble ui`, port-forward na localhost:12000), README.md:37,
# docs/architektura.md:49; Hubble UI i Relay włącza platform/cilium/values.yaml:17-22.
hubble_ui = "http://localhost:12000"

# Bez up/prepare/down: `make hubble-ui` (Makefile:38-40) to port-forward na pierwszym planie,
# który kończy tylko Ctrl+C, a repozytorium nie ma polecenia, które uruchamia go w tle albo zatrzymuje.
# Przed /qa:run uruchom `make cluster` (Makefile:19-36), a potem `make hubble-ui` w osobnym terminalu.
[env.services]
# docs/plans/2026-10-20-t03-kind-cilium-hubble.md:241 (Verification, krok 10): przy działającym
# `make hubble-ui` oczekiwany kod odpowiedzi GET http://localhost:12000/ to 200.
health = ["hubble_ui:/"]

[qa]
fix = "approve"
mutations = "deny"
start_services = "ask"
