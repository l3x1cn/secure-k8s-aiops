[project]
name = "aiops"
version = "0.1.0"
description = "Detekcja anomalii: cechy z Prometheusa, model, detektor i ewaluacja"
requires-python = "==3.13.*"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
