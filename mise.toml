# Wersje narzędzi zespołu (T02); ten sam plik czyta CI (T06).
# Zmiana wersji: PR, który aktualizuje też „Komponenty i wersje” w docs/architektura.md.
# Nowe narzędzie dopisz też do tabeli w scripts/doctor.sh.
# Tylko min_version i [tools] ze zwykłymi wersjami: plik nie wymaga `mise trust`.
# min_version to też wersja mise w CI (zmienna CI_MISE_VERSION w .github/workflows/ci.yml, input version akcji jdx/mise-action): zmieniaj razem.
# mise.lock (sumy kontrolne narzędzi, generowany): zmiana wersji w [tools] wymaga w tym samym PR wygenerowania go od nowa:
# `mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64`. Z tym plikiem jdx/mise-action instaluje z `--locked`.
min_version = "2026.10.25"

[tools]
python = "3.13.16"
uv = "0.13.7"
ruff = "0.17.3"
kind = "0.33.0"
kubectl = "1.37.1"
helm = "4.3.1"
kustomize = "5.8.3"
cilium-cli = "0.20.1"
"github:cilium/hubble" = "1.20.2"
trivy = "0.76.0" # nigdy 0.69.4 (CVE-2026-33634)
gitleaks = "8.30.1"
kubeconform = "0.8.0"
promtool = "3.15.0"
yq = "4.54.1" # make manifests: spec PrometheusRule dla promtool (T19)
opentofu = "1.13.1" # rozszerzenie T33
