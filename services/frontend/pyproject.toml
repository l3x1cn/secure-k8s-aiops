[project]
name = "frontend"
version = "0.1.0"
description = "Publiczna usługa sklepu: lista produktów i składanie zamówień"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "observability",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
observability = { workspace = true }
