[project]
name = "secure-k8s-aiops"
version = "0.1.0"
description = "Bezpieczna platforma Kubernetes z obserwowalnością AI"
requires-python = "==3.13.*"
# Pakiety workspace'u jako zależności korzenia: `uv sync` instaluje je do .venv.
dependencies = ["chaos", "frontend", "orders"]

[tool.uv]
# Katalog główny to korzeń workspace'u, nie pakiet.
package = false

[tool.uv.workspace]
# Zadanie, które tworzy pakiet Pythona (np. services/frontend w T05, chaos w T08,
# aiops w T20), dopisuje tu jego katalog razem z jego pyproject.toml,
# a nazwę pakietu do ignore w .github/dependabot.yml.
# Katalog z tej listy bez pyproject.toml przerywa `uv sync`.
members = ["chaos", "libs/observability", "services/frontend", "services/orders"]

[tool.uv.sources]
chaos = { workspace = true }
frontend = { workspace = true }
orders = { workspace = true }

[dependency-groups]
# Notebooki aiops/notebooks (T09): `uv run jupyter nbconvert --to notebook --execute <plik>`.
# numpy/pandas/scikit-learn przejdą do zależności pakietu aiops w T20.
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
# Testy jednostkowe bez klastra (`make unit`, job unit w CI). Testy wymagające klastra
# trafiają do tests/ (T11–T14, T26, T27), który nie należy do testpaths.
testpaths = ["chaos", "libs", "services"]
# Usługi mają osobne katalogi tests/ z plikami o tych samych nazwach.
addopts = ["--import-mode=importlib"]
# Testy bezpieczeństwa na klastrze (tests/security, T11–T14); wybiera je `-m security` (make test-security, T26).
markers = ["security: test bezpieczeństwa na działającym klastrze (tests/security)"]

[tool.ruff]
# `make lint` i job lint w CI (T06); ruff w wersji z mise.toml. Sprawdza też notebooki (aiops/notebooks)
# i bloki ```python w plikach .md (README, docs/): od ruff 0.16 `ruff format` domyślnie formatuje je w Markdownie,
# więc docs-only PR z niesformatowanym blokiem nie przejdzie joba lint.
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# Dawny domyślny zestaw ruff (E4, E7, E9, F), zapisany jawnie. Ruff od 0.16 ma szerszy domyślny zestaw,
# którego nie włączamy (wymagałby poprawek w istniejącym kodzie). Zestaw zmienia się tylko przez PR.
select = ["E4", "E7", "E9", "F"]
