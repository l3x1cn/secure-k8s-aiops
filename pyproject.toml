[project]
name = "secure-k8s-aiops"
version = "0.1.0"
description = "Bezpieczna platforma Kubernetes z obserwowalnością AI"
requires-python = "==3.13.*"
# Pakiety workspace'u jako zależności korzenia: `uv sync` instaluje je do .venv.
dependencies = ["chaos", "frontend", "orders"]

[tool.uv]
# Katalog główny to korzeń workspace'u, nie pakiet.
package = false

[tool.uv.workspace]
# Zadanie, które tworzy pakiet Pythona (np. services/frontend w T05, chaos w T08,
# aiops w T20), dopisuje tu jego katalog razem z jego pyproject.toml.
# Katalog z tej listy bez pyproject.toml przerywa `uv sync`.
members = ["chaos", "libs/observability", "services/frontend", "services/orders"]

[tool.uv.sources]
chaos = { workspace = true }
frontend = { workspace = true }
orders = { workspace = true }

[dependency-groups]
# Notebooki aiops/notebooks (T09): `uv run jupyter nbconvert --to notebook --execute <plik>`.
# numpy/pandas/scikit-learn przejdą do zależności pakietu aiops w T20.
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["chaos", "libs", "services"]
# Usługi mają osobne katalogi tests/ z plikami o tych samych nazwach.
addopts = ["--import-mode=importlib"]
